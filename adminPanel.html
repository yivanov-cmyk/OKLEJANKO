<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>Panel Administracyjny</title>
</head>
<body class="bg-gray-100 p-6 font-sans">

<div class="container mx-auto max-w-4xl">
    <h1 class="text-3xl font-bold mb-8 text-center text-gray-800">Panel Administracyjny</h1>
    
    <div id="message-container" class="fixed top-4 right-4 z-50"></div>

    <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">Aktywni Użytkownicy</h2>
        <div id="active-users-container" class="space-y-4">
            </div>
    </div>
    
    <div id="service-management" class="bg-white p-6 rounded-lg shadow-lg mb-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">Zarządzanie Procedurami</h2>
        
        <div id="services-container" class="space-y-6">
            </div>

        <button id="add-procedure-btn" class="mt-6 px-6 py-2 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75 transition duration-150 ease-in-out">
            Dodaj nową procedurę
        </button>
        <button id="save-procedures-btn" class="mt-6 ml-2 px-6 py-2 bg-green-500 text-white font-semibold rounded-lg shadow-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 transition duration-150 ease-in-out">
            Zapisz zmiany
        </button>
    </div>
    
    <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">Top Pracownicy Dziś (FLOW)</h2>
        <div id="top-workers-container" class="flex flex-col space-y-2">
            </div>
    </div>

    <div id="admin-actions" class="bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">Akcje Administracyjne</h2>
        <button id="clear-sessions-btn" class="px-6 py-2 bg-red-500 text-white font-semibold rounded-lg shadow-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-opacity-75 transition duration-150 ease-in-out">
            Wyczyść wszystkie aktywne sesje
        </button>
    </div>

</div>

<script>
    // Globalne zmienne do śledzenia stanu
    let originalProcedures = [];
    let currentProcedures = [];
    
    // Funkcje do obsługi interfejsu i komunikacji
    function showMessage(message, type = 'success') {
        const container = document.getElementById('message-container');
        const alertDiv = document.createElement('div');
        let colorClass = type === 'success' ? 'bg-green-500' : 'bg-red-500';
        
        alertDiv.className = `${colorClass} text-white p-4 rounded-lg shadow-lg mb-2 transform transition-transform duration-300 translate-x-full`;
        alertDiv.textContent = message;
        container.appendChild(alertDiv);
        
        setTimeout(() => {
            alertDiv.classList.remove('translate-x-full');
            alertDiv.classList.add('translate-x-0');
        }, 10);

        setTimeout(() => {
            alertDiv.classList.remove('translate-x-0');
            alertDiv.classList.add('translate-x-full');
            alertDiv.addEventListener('transitionend', () => alertDiv.remove());
        }, 5000);
    }
    
    function showLoadingIndicator(btn) {
      btn.innerHTML = 'Ładowanie...';
      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
    }

    function hideLoadingIndicator(btn, originalText) {
      btn.innerHTML = originalText;
      btn.disabled = false;
      btn.classList.remove('opacity-50', 'cursor-not-allowed');
    }

    function onError(error) {
        showMessage('Wystąpił błąd: ' + error.message, 'error');
        console.error('Błąd po stronie serwera:', error);
        loadData();
    }

    // Ładowanie danych z serwera
    function loadData() {
        google.script.run
            .withSuccessHandler(onProceduresLoaded)
            .withFailureHandler(onError)
            .getServicesConfig();
            
        google.script.run
            .withSuccessHandler(onActiveUsersLoaded)
            .withFailureHandler(onError)
            .getActiveSessions(); 
        
     
        google.script.run
            .withSuccessHandler(onTopWorkersLoaded)
            .withFailureHandler(onError)
            .getWorkmodeStatsForMonth("A_FLO"); 
    
        google.script.run
        .withSuccessHandler(onParametersLoaded)
        .withFailureHandler(onError)
        .getPredefinedParameters();    
    }
    let allParameters = [];

    function onParametersLoaded(params) {
        allParameters = params;
    }

// Funkcja pomocnicza do tworzenia listy opcji dla selecta
    function createParameterSelect(id, selectedParams) {
        let selectHtml = `<select id="${id}" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2" multiple>`;
        allParameters.forEach(param => {
            const isSelected = selectedParams.includes(param);
            selectHtml += `<option value="${param}" ${isSelected ? 'selected' : ''}>${param}</option>`;
        });
        selectHtml += `</select>`;
        return selectHtml;
    }
    // Funkcje obsługi danych z serwera
    function onProceduresLoaded(response) {
        if (!response) {
            response = {};
        }
        
        // Konwertuj obiekt na tablicę, która będzie łatwiejsza do renderowania
        const proceduresArray = Object.keys(response).map(key => ({
            name: key,
            display: key, // Nazwa wyświetlana
            workmode: response[key].workmode,
            startParameters: response[key].startParameters,
            stopParameters: response[key].stopParameters
        }));
        
        originalProcedures = JSON.parse(JSON.stringify(proceduresArray)); // Głęboka kopia
        currentProcedures = JSON.parse(JSON.stringify(proceduresArray));
        renderProcedures();
    }
    
    function onActiveUsersLoaded(users) {
        const container = document.getElementById('active-users-container');
        container.innerHTML = '';
        if (users.length === 0) {
            container.innerHTML = '<p class="text-gray-500">Brak aktywnych użytkowników.</p>';
            return;
        }
        
        users.forEach(user => {
            const userDiv = document.createElement('div');
            userDiv.className = 'flex justify-between items-center p-4 bg-gray-50 rounded-lg shadow-sm';
            userDiv.innerHTML = `
                <div>
                    <p class="font-semibold text-gray-800">${user.loginMask}</p>
                    <p class="text-sm text-gray-600">${user.procedure} (od ${new Date(user.startTimestamp).toLocaleTimeString()})</p>
                    <p class="text-xs text-gray-400">ID sesji: ${user.id}</p>
                </div>
                <button class="finish-session-btn px-4 py-2 bg-red-500 text-white text-sm rounded-lg shadow-md hover:bg-red-600 transition duration-150 ease-in-out" data-id="${user.id}">Zakończ</button>
            `;
            container.appendChild(userDiv);
        });
    }

    function onTopWorkersLoaded(workers) {
      const container = document.getElementById('top-workers-container');
      container.innerHTML = '';
      if (workers.length === 0) {
        container.innerHTML = '<p class="text-gray-500">Brak danych dla dzisiaj.</p>';
        return;
      }

      workers.forEach((worker, index) => {
        const workerDiv = document.createElement('div');
        const rankColors = ['bg-yellow-300', 'bg-gray-300', 'bg-yellow-800'];
        const medalEmoji = ['🥇', '🥈', '🥉'];
        workerDiv.className = `p-3 rounded-lg flex items-center shadow-md ${rankColors[index] || 'bg-gray-200'}`;
        workerDiv.innerHTML = `
          <div class="text-2xl mr-4">${medalEmoji[index] || ''}</div>
          <div class="flex-grow">
            <p class="font-bold text-lg">${worker.user}</p>
            <p class="text-sm">Wykonane FLO: <span class="font-semibold">${worker.qty}</span></p>
          </div>
        `;
        container.appendChild(workerDiv);
      });
    }
    function initializeRefresh() {
      // Funkcja, która odświeża statystyki
      const refreshStats = () => {
        google.script.run
          .withSuccessHandler(onTopWorkersLoaded)
          .withFailureHandler(onError)
          .getWorkmodeStatsForMonth("A_FLO");
      };

      // Ustaw interwał odświeżania na 12 godzin (12 * 60 * 60 * 1000 ms)
      // Przykładowo dla 2 razy dziennie. Możesz dostosować, np. o 6 rano i 18 wieczorem.
      refreshInterval = setInterval(refreshStats, 12 * 60 * 60 * 1000);
    }
    // Renderowanie interfejsu
    function renderProcedures() {
        const container = document.getElementById('services-container');
        container.innerHTML = '';
        currentProcedures.forEach((procedure, index) => {
            const procedureDiv = document.createElement('div');
            procedureDiv.className = 'procedure-item bg-gray-50 p-4 rounded-lg shadow-sm border border-gray-200';
            procedureDiv.setAttribute('data-index', index);
            
            // Utwórz listy rozwijane dla parametrów startowych i końcowych
            const startParamsSelectHtml = createParameterSelect(`start-params-${index}`, procedure.startParameters);
            const stopParamsSelectHtml = createParameterSelect(`stop-params-${index}`, procedure.stopParameters);

            procedureDiv.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-medium text-gray-900">${procedure.name}</h3>
                    <button class="remove-procedure-btn px-3 py-1 bg-red-500 text-white text-xs font-semibold rounded-md hover:bg-red-600 transition duration-150 ease-in-out">Usuń</button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nazwa procedury (systemowa):</label>
                        <input type="text" class="procedure-name mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2" value="${procedure.name || ''}" disabled>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Workmode:</label>
                        <input type="text" class="procedure-workmode mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2" value="${procedure.workmode || ''}">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Parametry startowe:</label>
                        ${startParamsSelectHtml}
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Parametry końcowe:</label>
                        ${stopParamsSelectHtml}
                    </div>
                </div>
            `;
            container.appendChild(procedureDiv);
        });
    }

    // Obsługa zdarzeń
    document.addEventListener('click', (event) => {
        const target = event.target;
        
        // Zakończenie sesji
        if (target.classList.contains('finish-session-btn')) {
            if (confirm('Czy na pewno chcesz zakończyć tę sesję?')) {
                const sessionId = target.dataset.id;
                showLoadingIndicator(target);
                google.script.run
                    .withSuccessHandler(response => {
                        showMessage(response.message);
                        loadData();
                    })
                    .withFailureHandler(onError)
                    .finishProcessByAdmin(sessionId);
            }
        }
    });

    // Obsługa zdarzeń dla zarządzania procedurami
    document.getElementById('services-container').addEventListener('click', (event) => {
        const target = event.target;
        if (target.classList.contains('remove-procedure-btn')) {
            const procedureItem = target.closest('.procedure-item');
            const index = parseInt(procedureItem.dataset.index);
            currentProcedures.splice(index, 1);
            renderProcedures();
        }
    });
    
    document.getElementById('add-procedure-btn').addEventListener('click', () => {
        currentProcedures.push({ name: '', workmode: '', startParameters: [], stopParameters: [] });
        renderProcedures();
    });

    document.getElementById('save-procedures-btn').addEventListener('click', (event) => {
    const btn = event.target;
    showLoadingIndicator(btn);

    const currentProceduresToSave = [];
    const procedureItems = document.querySelectorAll('.procedure-item');
    procedureItems.forEach(item => {
        const name = item.querySelector('.procedure-name').value.trim();
        const workmode = item.querySelector('.procedure-workmode').value.trim();
        
        // Zbieranie wybranych opcji z listy rozwijanej
        const startSelect = document.getElementById(`start-params-${item.dataset.index}`);
        const startParams = Array.from(startSelect.selectedOptions).map(option => option.value);

        const stopSelect = document.getElementById(`stop-params-${item.dataset.index}`);
        const stopParams = Array.from(stopSelect.selectedOptions).map(option => option.value);

        if (!name) {
            showMessage('Błąd: Nazwa procedury nie może być pusta.', 'error');
            hideLoadingIndicator(btn, 'Zapisz zmiany');
            return;
        }

        currentProceduresToSave.push({ name, workmode, startParameters: startParams, stopParameters: stopParams });
    });

    google.script.run
        .withSuccessHandler(response => {
            showMessage(response.message, response.success ? 'success' : 'error');
            loadData();
        })
        .withFailureHandler(onError)
        .saveProcedures(currentProceduresToSave);
});
    let refreshInterval;


    document.getElementById('clear-sessions-btn').addEventListener('click', (event) => {
        if (confirm('Czy na pewno chcesz wyczyścić wszystkie aktywne sesje? Tego działania nie można cofnąć.')) {
            const btn = event.target;
            showLoadingIndicator(btn);
            google.script.run
                .withSuccessHandler(response => {
                    showMessage(response.message);
                    loadData();
                    hideLoadingIndicator(btn, 'Wyczyść wszystkie aktywne sesje');
                })
                .withFailureHandler(onError)
                .clearAllActiveSessions();
        }
    });

  window.onload = () => {
      loadData();
      initializeRefresh();
};
</script>

</body>
</html>
